kind = "web"
previewPath = "/"
title = "GovWatch"
version = "1.0.0"
id = "artifacts/govwatch"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
localPort = 20393
name = "web"
paths = ["/"]

[services.development]
run = "pnpm --filter @workspace/govwatch run dev"

[services.env]
PORT = "20393"
BASE_PATH = "/"

[services.production]
build = ["pnpm", "--filter", "@workspace/govwatch", "run", "build"]
publicDir = "artifacts/govwatch/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"
